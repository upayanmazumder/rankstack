services:
  mongo:
    image: mongo:7
    container_name: rankstack_mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 15

  mongo-rs-init:
    image: mongo:7
    container_name: rankstack_mongo_rs_init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --quiet --eval '
        try {
          rs.status();
          print("replica set already initiated");
        } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
          print("replica set initiated");
        }'

  redis:
    image: redis:7-alpine
    container_name: rankstack_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  redis_data:
