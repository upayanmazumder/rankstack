# No PVC -- the app treats Redis as derived/rebuildable state (leaderboard
# sorted sets, sessions, rate-limit counters), never the source of truth.
# maxmemory + allkeys-lru caps it as a bounded cache on a shared node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rankstack-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: rankstack-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rankstack-redis
  template:
    metadata:
      labels:
        app: rankstack-redis
    spec:
      priorityClassName: {{ .Values.priorityClassName }}
      {{- include "rankstack.nodeAffinity" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rankstack-redis
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: rankstack-redis
  ports:
    - port: 6379
      targetPort: 6379
