# api/main.py's startup hook calls init_db() (creates collections,
# $jsonSchema validators, indexes) on every boot -- idempotent, matching the
# bitvaultd/meghmitra-api "run on every rollout" migrate pattern, just baked
# into the app itself instead of a separate initContainer. init_db() needs
# the replica set already initiated (see mongo-rs-init-job.yaml's sync-wave
# 1) -- sync-wave 2 here guarantees that Job ran and succeeded first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rankstack-api
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: rankstack-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: rankstack-api
  template:
    metadata:
      labels:
        app: rankstack-api
    spec:
      priorityClassName: {{ .Values.priorityClassName }}
      {{- include "rankstack.nodeAffinity" . | nindent 6 }}
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rankstack-mongo 27017; do echo waiting for mongo; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rankstack-redis 6379; do echo waiting for redis; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: rankstack-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: rankstack-api-env
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rankstack-api
---
apiVersion: v1
kind: Service
metadata:
  name: rankstack-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: rankstack-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
