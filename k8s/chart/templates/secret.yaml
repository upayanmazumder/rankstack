# Plaintext Secret content is generated from .Values.env -- the GitOps repo
# supplies real per-cluster overrides via a values file, never committed to
# this (public) repo. See values.yaml's top comment.
apiVersion: v1
kind: Secret
metadata:
  name: rankstack-api-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MONGO_URI: "mongodb://rankstack-mongo:27017/?replicaSet=rs0"
  REDIS_URI: "redis://rankstack-redis:6379/0"
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
