packages:
  - '.'
allowBuilds:
  sharp: true
  unrs-resolver: true
overrides:
  # brace-expansion reaches the tree only through minimatch, so no direct
  # dependency can be bumped to move it. Pin the 5.x line to the release that
  # carries the CVE-2026-14257 mitigation bypass fix (GHSA 4.0.0 <5.0.9).
  '@vitest/mocker@>=5.0.0-beta.1 <5.0.3': ^5.0.3
  '@vitest/mocker@>=5.0.0-rc.2 <5.0.3': ^5.0.3
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  'brace-expansion@^5.0.0': '5.0.12'
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=3.1.3 <3.1.9: ^3.1.9
  follow-redirects@>=1.16.0 <1.16.1: ^1.16.1
  hono@>=4.12.4 <4.13.11: ^4.13.11
  ip-address@<=10.7.3: ^10.7.4
  # seroval reaches the tree via solid-js and @tanstack/react-query-devtools.
  # Override to >=1.6.9 to resolve GHSA-p6vx-979v-rg4c and GHSA-jp82-f5mq-hwhp.
  seroval: '>=1.6.9'
  seroval-plugins: '>=1.6.9'
  undici@>=7.0.0 <7.30.1: ^7.30.1
  undici@>=7.15.0 <7.30.1: ^7.30.1
  undici@>=7.18.0 <7.30.1: ^7.30.1
  vite@>=8.0.0 <=8.1.5: ^8.1.6
  zod@<4.6.6: ^4.6.6
