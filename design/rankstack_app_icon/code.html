<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Subtle Internal Glow Grid Pattern -->
  <g opacity="0.08">
    <circle cx="96" cy="96" r="2" fill="#818cf8"/>
    <circle cx="160" cy="96" r="2" fill="#818cf8"/>
    <circle cx="224" cy="96" r="2" fill="#818cf8"/>
    <circle cx="288" cy="96" r="2" fill="#818cf8"/>
    <circle cx="352" cy="96" r="2" fill="#818cf8"/>
    <circle cx="416" cy="96" r="2" fill="#818cf8"/>
    <circle cx="96" cy="416" r="2" fill="#818cf8"/>
    <circle cx="160" cy="416" r="2" fill="#818cf8"/>
    <circle cx="224" cy="416" r="2" fill="#818cf8"/>
    <circle cx="288" cy="416" r="2" fill="#818cf8"/>
    <circle cx="352" cy="416" r="2" fill="#818cf8"/>
    <circle cx="416" cy="416" r="2" fill="#818cf8"/>
  </g>

  <!-- Ambient Glow Behind Bars -->
  <ellipse cx="256" cy="300" rx="140" ry="80" fill="#4f46e5" opacity="0.25" filter="url(#glow)"/>
  <circle cx="356" cy="220" r="60" fill="#f59e0b" opacity="0.2" filter="url(#glow)"/>

  <!-- Stacked Geometric Ascending Podium Bars -->
  <!-- Bar 1 (Left / Tier 3): Silver/Indigo Base -->
  <rect x="116" y="270" width="68" height="130" rx="16" fill="url(#indigoGrad)" opacity="0.9"/>
  <!-- Highlight Top Edge -->
  <rect x="122" y="274" width="56" height="4" rx="2" fill="#a5b4fc" opacity="0.6"/>

  <!-- Bar 2 (Middle / Tier 2): Deep Vibrant Indigo-Violet High Stack -->
  <rect x="204" y="200" width="68" height="200" rx="16" fill="url(#violetGrad)"/>
  <!-- Highlight Top Edge -->
  <rect x="210" y="204" width="56" height="4" rx="2" fill="#c7d2fe" opacity="0.8"/>

  <!-- Bar 3 (Right / Tier 1 Pinnacle): Amber/Gold Winner Podium Stack -->
  <rect x="292" y="130" width="68" height="270" rx="16" fill="url(#amberGrad)"/>
  <!-- Highlight Top Edge -->
  <rect x="298" y="134" width="56" height="4" rx="2" fill="#fef3c7" opacity="0.9"/>

  <!-- Floating Pinnacle Master Crown / Diamond Node above the 1st place bar -->
  <polygon points="326,76 344,98 326,120 308,98" fill="#fef08a" filter="url(#glow)" />
  <circle cx="326" cy="98" r="4" fill="#ffffff" />

  <!-- Base Baseline Runway -->
  <rect x="96" y="416" width="320" height="6" rx="3" fill="#312e81" opacity="0.6"/>
  <rect x="272" y="416" width="108" height="6" rx="3" fill="#f59e0b" opacity="0.7"/>
</svg>
