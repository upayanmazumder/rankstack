<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%" style="background:#ffffff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="30" font-size="14" font-weight="bold" fill="#0f172a">Data Flow Diagram: Submission Ingestion, Scoring, and Leaderboard Synchronization</text>
  <text x="30" y="48" font-size="10" fill="#64748b">Level-1 Data Flow showing rate limiting, two-phase ACID transactions, Lua cache updates, and polling</text>

  <!-- External Entity: Client -->
  <g transform="translate(30, 100)">
    <rect width="130" height="70" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="65" y="32" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">CONTESTANT</text>
    <text x="65" y="48" font-size="9" fill="#475569" text-anchor="middle">(Web Client)</text>
  </g>

  <!-- Process 1.0: Rate Limiter -->
  <g transform="translate(210, 100)">
    <rect width="140" height="70" rx="35" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="280" y="32" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">1.0 Check Rate Limit</text>
    <text x="280" y="48" font-size="8.5" fill="#475569" text-anchor="middle">fixed-window (10 / 60s)</text>
  </g>

  <!-- Flow Client -> P1.0 -->
  <path d="M 160 135 L 210 135" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="185" y="127" font-size="8" fill="#334155" text-anchor="middle">submit code</text>

  <!-- Data Store D1: Redis Cache -->
  <g transform="translate(220, 240)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#1e293b" stroke-width="1.6"/>
    <line x1="0" y1="50" x2="160" y2="50" stroke="#1e293b" stroke-width="1.6"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#1e293b" stroke-width="1.6"/>
    <text x="20" y="28" font-size="10" font-weight="bold" fill="#0f172a">D1</text>
    <text x="50" y="22" font-size="9" font-weight="bold" fill="#0f172a">Redis 7.4 In-Memory</text>
    <text x="50" y="38" font-size="8" fill="#64748b">rate_limit &amp; ZSET</text>
  </g>

  <!-- Flow P1.0 <-> D1 -->
  <path d="M 280 170 L 280 240" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="285" y="205" font-size="7.5" fill="#334155">INCR &amp; EXPIRE</text>

  <!-- Process 2.0: Transaction #1 Ingest -->
  <g transform="translate(400, 100)">
    <rect width="145" height="70" rx="35" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="472" y="30" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">2.0 Ingest Submission</text>
    <text x="472" y="44" font-size="8" fill="#475569" text-anchor="middle">ACID Transaction #1</text>
    <text x="472" y="56" font-size="8" fill="#475569" text-anchor="middle">insert + bump attempts</text>
  </g>

  <!-- Flow P1.0 -> P2.0 -->
  <path d="M 350 135 L 400 135" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="375" y="127" font-size="7.5" fill="#334155" text-anchor="middle">allowed</text>

  <!-- Data Store D2: MongoDB Replica Set -->
  <g transform="translate(480, 240)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#1e293b" stroke-width="1.6"/>
    <line x1="0" y1="50" x2="200" y2="50" stroke="#1e293b" stroke-width="1.6"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#1e293b" stroke-width="1.6"/>
    <text x="20" y="28" font-size="10" font-weight="bold" fill="#0f172a">D2</text>
    <text x="50" y="22" font-size="9" font-weight="bold" fill="#0f172a">MongoDB 7.0 (rs0)</text>
    <text x="50" y="38" font-size="8" fill="#64748b">submissions, problems, users</text>
  </g>

  <!-- Flow P2.0 -> D2 -->
  <path d="M 470 170 L 470 205 L 520 205 L 520 240" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="495" y="195" font-size="7.5" fill="#334155" text-anchor="middle">write pending</text>

  <!-- Process 3.0: Evaluator -->
  <g transform="translate(600, 100)">
    <rect width="130" height="70" rx="35" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="665" y="32" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">3.0 Evaluate Solution</text>
    <text x="665" y="48" font-size="8" fill="#475569" text-anchor="middle">Test suite execution</text>
  </g>

  <!-- Flow P2.0 -> P3.0 -->
  <path d="M 545 135 L 600 135" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="572" y="127" font-size="7.5" fill="#334155" text-anchor="middle">pending doc</text>

  <!-- Process 4.0: Transaction #2 Score & Dirty Revision -->
  <g transform="translate(600, 360)">
    <rect width="145" height="75" rx="37" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="672" y="30" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">4.0 Score &amp; Revision</text>
    <text x="672" y="44" font-size="8" fill="#475569" text-anchor="middle">ACID Transaction #2</text>
    <text x="672" y="56" font-size="8" fill="#475569" text-anchor="middle">verdict + score delta</text>
    <text x="672" y="68" font-size="8" fill="#475569" text-anchor="middle">+ bump version</text>
  </g>

  <!-- Flow P3.0 -> P4.0 -->
  <path d="M 665 170 L 665 360" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="675" y="270" font-size="8" fill="#334155">verdict &amp; score</text>

  <!-- Flow P4.0 -> D2 -->
  <path d="M 600 390 L 550 390 L 550 290" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="540" y="345" font-size="7.5" fill="#334155" text-anchor="end">commit score + dirty_leaderboards</text>

  <!-- Process 5.0: Lua Delta Update -->
  <g transform="translate(360, 360)">
    <rect width="145" height="75" rx="37" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="432" y="32" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">5.0 Conditional Lua</text>
    <text x="432" y="48" font-size="8" fill="#475569" text-anchor="middle">Atomic ZINCRBY if</text>
    <text x="432" y="60" font-size="8" fill="#475569" text-anchor="middle">stored rev &lt; delta version</text>
  </g>

  <!-- Flow P4.0 -> P5.0 -->
  <path d="M 600 400 L 505 400" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="552" y="392" font-size="7.5" fill="#334155" text-anchor="middle">delta &amp; version</text>

  <!-- Flow P5.0 -> D1 -->
  <path d="M 400 360 L 400 310 L 340 310 L 340 290" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="375" y="325" font-size="7.5" fill="#334155" text-anchor="middle">update ZSET</text>

  <!-- Process 6.0: Fetch Live Leaderboard -->
  <g transform="translate(80, 240)">
    <rect width="115" height="55" rx="27" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="137" y="26" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">6.0 Read Board</text>
    <text x="137" y="40" font-size="8" fill="#475569" text-anchor="middle">ZREVRANGE &lt; 1ms</text>
  </g>

  <!-- Flow D1 -> P6.0 -->
  <path d="M 220 265 L 195 265" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Flow P6.0 -> Client -->
  <path d="M 120 240 L 120 170" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="105" y="205" font-size="7.5" fill="#334155" text-anchor="end">poll ranks (5s)</text>

</svg>
