<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="100%" height="100%" style="background:#ffffff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 13.5px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 10px; fill: #64748b; }
      .p-num { font-size: 10.5px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .p-sub { font-size: 9px; fill: #475569; text-anchor: middle; }
      .store-id { font-size: 11px; font-weight: bold; fill: #0f172a; }
      .store-name { font-size: 10px; font-weight: bold; fill: #1e293b; }
      .store-sub { font-size: 8.5px; fill: #64748b; }
      .flow-label { font-size: 8.5px; fill: #334155; font-weight: 500; }
      .flow-label-center { font-size: 8.5px; fill: #334155; font-weight: 500; text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="30" y="28" class="title">Level-1 Data Flow Diagram: Submission Ingestion, Scoring, and Leaderboard Synchronization</text>
  <text x="30" y="44" class="subtitle">Numbered processes, isolated storage tiers, rate limiting, and 30-second client polling</text>

  <!-- ================= EXTERNAL ENTITY: CONTESTANT ================= -->
  <rect x="25" y="90" width="130" height="65" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="90" y="120" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">CONTESTANT</text>
  <text x="90" y="136" font-size="9" fill="#64748b" text-anchor="middle">(Web Client)</text>

  <!-- Flow: Contestant -> 1.0 -->
  <path d="M 155 122 L 208 122" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="182" y="114" class="flow-label-center">submit code</text>

  <!-- ================= PROCESS 1.0: RATE LIMIT ================= -->
  <rect x="210" y="92" width="140" height="60" rx="30" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="280" y="120" class="p-num">1.0 Rate Limit</text>
  <text x="280" y="135" class="p-sub">fixed-window (10 / 60s)</text>

  <!-- Flow: 1.0 -> 2.0 -->
  <path d="M 350 122 L 403 122" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="376" y="114" class="flow-label-center">allowed</text>

  <!-- ================= PROCESS 2.0: INGEST SUBMISSION ================= -->
  <rect x="405" y="92" width="155" height="60" rx="30" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="482" y="115" class="p-num">2.0 Ingest Submission</text>
  <text x="482" y="129" class="p-sub">ACID Transaction #1</text>
  <text x="482" y="141" class="p-sub">insert + attemptCount</text>

  <!-- Flow: 2.0 -> 3.0 -->
  <path d="M 560 122 L 613 122" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="586" y="114" class="flow-label-center">pending doc</text>

  <!-- ================= PROCESS 3.0: EVALUATE ================= -->
  <rect x="615" y="92" width="145" height="60" rx="30" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="687" y="120" class="p-num">3.0 Evaluate</text>
  <text x="687" y="135" class="p-sub">test suite grading</text>

  <!-- ================= DATA STORE D1: REDIS ================= -->
  <g transform="translate(205, 220)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="0" y1="52" x2="160" y2="52" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="0" y1="0" x2="0" y2="52" stroke="#1e293b" stroke-width="1.8"/>
    <text x="14" y="24" class="store-id">D1</text>
    <text x="38" y="21" class="store-name">Redis 7.4 In-Memory</text>
    <text x="38" y="38" class="store-sub">rate_limit &amp; ZSET boards</text>
  </g>

  <!-- Flow: 1.0 <-> D1 -->
  <path d="M 280 152 L 280 218" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="286" y="188" class="flow-label">INCR &amp; EXPIRE</text>

  <!-- ================= DATA STORE D2: MONGODB ================= -->
  <g transform="translate(485, 220)">
    <line x1="0" y1="0" x2="215" y2="0" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="0" y1="52" x2="215" y2="52" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="0" y1="0" x2="0" y2="52" stroke="#1e293b" stroke-width="1.8"/>
    <text x="14" y="24" class="store-id">D2</text>
    <text x="38" y="21" class="store-name">MongoDB 7.0 (rs0)</text>
    <text x="38" y="38" class="store-sub">submissions, problems, users, dirty</text>
  </g>

  <!-- Flow: 2.0 -> D2 -->
  <path d="M 482 152 L 482 188 L 530 188 L 530 218" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="506" y="181" class="flow-label-center">write pending</text>

  <!-- ================= PROCESS 4.0: SCORE UPDATE ================= -->
  <rect x="615" y="360" width="165" height="70" rx="35" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="697" y="387" class="p-num">4.0 Score Update</text>
  <text x="697" y="402" class="p-sub">ACID Transaction #2</text>
  <text x="697" y="416" class="p-sub">status + score + version</text>

  <!-- Flow: 3.0 -> 4.0 -->
  <path d="M 687 152 L 687 358" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="695" y="260" class="flow-label">verdict &amp; score</text>

  <!-- Flow: 4.0 -> D2 -->
  <path d="M 650 360 L 650 274" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="642" y="325" class="flow-label" text-anchor="end">commit score &amp; rev</text>

  <!-- ================= PROCESS 5.0: CONDITIONAL LUA ================= -->
  <rect x="360" y="360" width="175" height="70" rx="35" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="447" y="387" class="p-num">5.0 Conditional Lua Update</text>
  <text x="447" y="402" class="p-sub">ZINCRBY if stored rev</text>
  <text x="447" y="416" class="p-sub">&lt; delta version</text>

  <!-- Flow: 4.0 -> 5.0 -->
  <path d="M 615 395 L 537 395" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="576" y="388" class="flow-label-center">delta &amp; version</text>

  <!-- Flow: 5.0 -> D1 -->
  <path d="M 447 360 L 447 310 L 320 310 L 320 274" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="384" y="325" class="flow-label-center">update ZSET</text>

  <!-- ================= PROCESS 6.0: READ LEADERBOARD ================= -->
  <rect x="25" y="215" width="130" height="60" rx="30" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="90" y="242" class="p-num">6.0 Read Leaderboard</text>
  <text x="90" y="258" class="p-sub">ZREVRANGE (&lt; 1 ms)</text>

  <!-- Flow: D1 -> 6.0 -->
  <path d="M 205 245 L 157 245" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="181" y="238" class="flow-label-center">ranks</text>

  <!-- Flow: 6.0 -> Contestant -->
  <path d="M 90 215 L 90 157" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="82" y="190" class="flow-label" text-anchor="end">poll ranks (30 s)</text>

</svg>
